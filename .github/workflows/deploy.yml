name: Deploy to Coolify

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Pull latest theme on server
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 178.156.192.164 >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key root@178.156.192.164 \
            "cd /var/lib/docker/volumes/vnltuznirpgnwdhlgdq1keeo_wordpress-files/_data/wp-content/themes/skylinecruises-wordpress-theme && git pull"
